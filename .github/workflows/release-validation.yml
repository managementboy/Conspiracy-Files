name: Release validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed-range whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check "HEAD^..HEAD"
          fi
      - name: Install the target Lua toolchain
        run: sudo apt-get update && sudo apt-get install --yes lua5.1
      - name: Validate and build twice
        run: python3 tools/release_pipeline.py reproducibility-test
