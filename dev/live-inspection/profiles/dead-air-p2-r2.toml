[run]
profile_id = "dead-air-p2-r2"
probe_id = "location-structure"
# Clean boots are the default. Pass both --site flags only when the operator
# explicitly wants the safe multi-site optimization.
allow_multi_site = true

[paths]
# This save must be an immediate Sandbox child and contain the marker below.
source_save = "/home/yogax380/Zomboid/Saves/Sandbox/2026-09-01_13-58-50"
pz_user_root = "/home/yogax380/Zomboid"
launcher = "/home/yogax380/.steam/steam/steamapps/common/ProjectZomboid/projectzomboid.sh"
evidence_root = "../../../tmp/live-inspection"

[safety]
source_marker = ".cf-live-inspection-source"
controls = ["latestSave.ini", "mods/default.txt", "options.ini", "debuglog.ini"]

[time_budgets]
normal_exit_seconds = 45

[[sites]]
id = "P2"
role = "police-property"
bounds = [13206, 3073, 13238, 3101]
entry_point = [13208.5, 3088.5, 0]
levels = [0, 1, 2, 3, 4, 5, 6, 7]
preferred_rooms = ["policeoffice", "policegunstorage", "policelocker"]

[[sites]]
id = "R2"
role = "relay-office"
bounds = [13549, 1572, 13581, 1604]
entry_point = [13564.5, 1596.5, 0]
levels = [0, 1, 2, 3, 4, 5, 6, 7]
preferred_rooms = ["communications", "newsroom", "office", "garage"]

[[gates]]
name = "menu"
pattern = "\\[CF-INSPECT\\].*kind=MENU_READY"
timeout_seconds = 90
retries = 1
action = "screenshot"

[[gates]]
name = "world-loading"
pattern = "\\[CF-INSPECT\\].*kind=WORLD_LOADING"
timeout_seconds = 90
retries = 1
action = "wait"

[[gates]]
name = "click-to-start"
pattern = "game loading took"
timeout_seconds = 360
retries = 1
action = "manual"

[[gates]]
name = "player-ready-modal-check"
pattern = "\\[CF-INSPECT\\].*kind=PLAYER_READY"
timeout_seconds = 180
retries = 1
action = "manual"

[[gates]]
name = "chunk-streaming"
pattern = "\\[CF-INSPECT\\].*kind=CHUNK_STABLE"
timeout_seconds = 180
retries = 2
action = "screenshot"

[[gates]]
name = "scan-completion"
pattern = "\\[CF-INSPECT\\].*kind=SCAN_COMPLETE"
timeout_seconds = 480
retries = 1
action = "screenshot"

[[gates]]
name = "run-completion"
pattern = "\\[CF-INSPECT\\].*kind=RUN_COMPLETE.*status=PASS"
timeout_seconds = 60
retries = 0
action = "wait"

[[gates]]
name = "normal-exit"
pattern = "\\[CF-INSPECT\\].*kind=NORMAL_EXIT_REQUESTED.*status=PASS"
timeout_seconds = 30
retries = 0
action = "wait"
